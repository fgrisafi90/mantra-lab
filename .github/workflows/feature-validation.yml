name: Feature validation

on:
  push:
    branches:
      - feature/fg-mantra-schierabilita-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mantra-lab
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run V2 and regression tests
        run: >-
          node --test
          tests/matchdayScore.test.js
          tests/compatibility.test.js
          tests/optimizer.test.js
          tests/recommendation.test.js
          tests/recommendation-v2.test.js
          tests/schierabilita.test.js
          tests/schierabilita-v2.test.js
          tests/schierabilitaSignals.test.js
          tests/schierabilita-ui.test.js
          tests/playerStats.test.js
          tests/playerStatsData.test.js
          tests/publicData.test.js
          tests/wiring-v2.test.js
          tests/real-data-smoke.test.js
      - name: Audit full repository suite
        continue-on-error: true
        run: npm test
      - name: Build app
        run: npm run build
