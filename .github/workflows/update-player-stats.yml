name: Update player stats

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: update-player-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mantra-lab
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Update player statistics
        run: node scripts/updatePlayerStats.mjs
      - name: Commit updated player statistics
        run: |
          if git diff --quiet -- src/data/generated/player-stats.json; then
            echo "No player stats changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/generated/player-stats.json
          git commit -m "Update player stats"
          git push
